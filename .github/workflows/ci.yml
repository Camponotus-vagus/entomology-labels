name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,all]

      - name: Run linting
        run: |
          flake8 entomology_labels tests --count --show-source --statistics

      # A virtual display, so the GUI tests run instead of skipping: the GUI
      # is otherwise the one part of the package CI never exercises.
      - name: Install a virtual display
        run: sudo apt-get install -y xvfb

      - name: Run tests
        run: |
          xvfb-run -a pytest tests/ -v --tb=short -rs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Check formatting with black
        run: black --check entomology_labels tests

      - name: Check imports with isort
        run: isort --check-only entomology_labels tests
