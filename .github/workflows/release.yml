name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true

# Read-only by default; only the job that creates the release can write.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # The tag is read from the environment, never interpolated into the
      # script: a workflow_dispatch input is free text.
      - name: Check the tag is a version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::'$RELEASE_TAG' is not a version tag such as v1.2.0 or v1.3.0rc1"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Without this, pushing v1.3.0 before bumping pyproject.toml publishes
      # binaries labelled 1.3.0 that report 1.2.0, and twine --skip-existing
      # quietly uploads nothing.
      - name: Check the tag matches the package version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "::error::tag $RELEASE_TAG does not match pyproject.toml version $version"
            exit 1
          fi

      # A tag on a commit whose tests fail must not publish anything; CI
      # runs on branches and pull requests, not on the tag itself.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Run the test suite
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,all]
          sudo apt-get install -y xvfb
          xvfb-run -a pytest tests/ -q

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            name: linux-x64
            artifact_name: entomology-labels-linux-x64
            asset_suffix: linux-x64.tar.gz

          # macOS Apple Silicon (ARM64)
          - os: macos-latest
            name: macos-arm64
            artifact_name: entomology-labels-macos-arm64
            asset_suffix: macos-arm64.tar.gz

          # macOS Intel (x64)
          - os: macos-15-intel
            name: macos-intel
            artifact_name: entomology-labels-macos-intel
            asset_suffix: macos-intel.tar.gz

          # Windows
          - os: windows-latest
            name: windows-x64
            artifact_name: entomology-labels-windows-x64
            asset_suffix: windows-x64.zip

    runs-on: ${{ matrix.os }}

    steps:
      # Build what the tag points at, not the branch a manual run started from.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[all]
          pip install pyinstaller

      - name: Build with PyInstaller (Unix)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --onefile --name entomology-labels \
            --paths . \
            --hidden-import entomology_labels \
            --hidden-import entomology_labels.cli \
            --hidden-import entomology_labels.gui \
            --hidden-import entomology_labels.label_generator \
            --hidden-import entomology_labels.input_handlers \
            --hidden-import entomology_labels.output_generators \
            --hidden-import entomology_labels.config \
            --hidden-import entomology_labels.config_io \
            --hidden-import entomology_labels.dates \
            --hidden-import entomology_labels.fit \
            --hidden-import entomology_labels.geocoding \
            --hidden-import entomology_labels.layout \
            --hidden-import entomology_labels.photos \
            --hidden-import entomology_labels.presets \
            --hidden-import entomology_labels.sites \
            scripts/entomology_labels_cli.py
          pyinstaller --onefile --windowed --name entomology-labels-gui \
            --paths . \
            --hidden-import entomology_labels \
            --hidden-import entomology_labels.cli \
            --hidden-import entomology_labels.gui \
            --hidden-import entomology_labels.label_generator \
            --hidden-import entomology_labels.input_handlers \
            --hidden-import entomology_labels.output_generators \
            --hidden-import entomology_labels.config \
            --hidden-import entomology_labels.config_io \
            --hidden-import entomology_labels.dates \
            --hidden-import entomology_labels.fit \
            --hidden-import entomology_labels.geocoding \
            --hidden-import entomology_labels.layout \
            --hidden-import entomology_labels.photos \
            --hidden-import entomology_labels.presets \
            --hidden-import entomology_labels.sites \
            scripts/entomology_labels_gui.py

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --name entomology-labels `
            --paths . `
            --hidden-import entomology_labels `
            --hidden-import entomology_labels.cli `
            --hidden-import entomology_labels.gui `
            --hidden-import entomology_labels.label_generator `
            --hidden-import entomology_labels.input_handlers `
            --hidden-import entomology_labels.output_generators `
            --hidden-import entomology_labels.config `
            --hidden-import entomology_labels.config_io `
            --hidden-import entomology_labels.dates `
            --hidden-import entomology_labels.fit `
            --hidden-import entomology_labels.geocoding `
            --hidden-import entomology_labels.layout `
            --hidden-import entomology_labels.photos `
            --hidden-import entomology_labels.presets `
            --hidden-import entomology_labels.sites `
            scripts/entomology_labels_cli.py
          pyinstaller --onefile --windowed --name entomology-labels-gui `
            --paths . `
            --hidden-import entomology_labels `
            --hidden-import entomology_labels.cli `
            --hidden-import entomology_labels.gui `
            --hidden-import entomology_labels.label_generator `
            --hidden-import entomology_labels.input_handlers `
            --hidden-import entomology_labels.output_generators `
            --hidden-import entomology_labels.config `
            --hidden-import entomology_labels.config_io `
            --hidden-import entomology_labels.dates `
            --hidden-import entomology_labels.fit `
            --hidden-import entomology_labels.geocoding `
            --hidden-import entomology_labels.layout `
            --hidden-import entomology_labels.photos `
            --hidden-import entomology_labels.presets `
            --hidden-import entomology_labels.sites `
            scripts/entomology_labels_gui.py

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p release
          cp dist/entomology-labels release/
          cp dist/entomology-labels-gui release/
          cp README.md LICENSE release/
          tar -czvf ${{ matrix.artifact_name }}.tar.gz -C release .

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item dist/entomology-labels.exe release/
          Copy-Item dist/entomology-labels-gui.exe release/
          Copy-Item README.md, LICENSE release/
          Compress-Archive -Path release/* -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -laR artifacts/

      - name: Get tag name
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          body: |
            ## Entomology Labels Generator ${{ steps.tag.outputs.tag }}

            ### Downloads

            | Platform | File |
            |----------|------|
            | Linux x64 | `entomology-labels-linux-x64.tar.gz` |
            | macOS Apple Silicon (M1/M2/M3) | `entomology-labels-macos-arm64.tar.gz` |
            | macOS Intel | `entomology-labels-macos-intel.tar.gz` |
            | Windows x64 | `entomology-labels-windows-x64.zip` |

            ### Installation

            #### With pip
            ```bash
            pip install 'entomology-labels[all] @ git+https://github.com/${{ github.repository }}@${{ steps.tag.outputs.tag }}'
            ```
            This installs this release straight from GitHub (git must be
            installed); the package is not published on PyPI.
            The `[all]` extra adds Excel and YAML input, Word and PDF output,
            and reading dates and coordinates from photo metadata. Without it
            the package reads CSV, TXT and JSON and writes HTML.

            Keep the quotes: `[all]` is a glob pattern in zsh, the default shell
            on macOS, so the unquoted form fails there.

            #### From Release Binary
            1. Download the appropriate archive for your platform
            2. Extract the archive
            3. Run `entomology-labels` (CLI) or `entomology-labels-gui` (GUI)

            ### What's Changed
            See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          # Optional: the project is distributed from GitHub, not PyPI. The
          # upload runs only once a token is configured.
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::notice::PYPI_API_TOKEN is not set; skipping the PyPI upload"
            exit 0
          fi
          # --skip-existing already tolerates a re-uploaded version; anything
          # else (bad token, network, invalid metadata) must fail the job
          # rather than be reported as a successful release.
          twine upload dist/* --skip-existing
